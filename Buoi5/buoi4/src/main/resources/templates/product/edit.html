<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
</head>
<body>
<div layout:fragment="content" class="container body-content">
    <h2>Edit Product</h2>

    <form th:action="@{/products/save}"
          th:object="${product}"
          method="post"
          enctype="multipart/form-data"
          class="form">

        <input type="hidden" th:field="*{id}">
        <input type="hidden" name="image" th:value="*{image}">

        <div class="form-group mb-3">
            <label for="name">Name:</label>
            <input class="form-control"
                   type="text"
                   th:field="*{name}"
                   id="name"
                   placeholder="Product Name">
        </div>

        <div class="form-group mb-3">
            <label>Current Image:</label><br>
            <img th:if="*{image} != null and *{image} != ''"
                 th:src="@{/images/{img}(img=*{image})}"
                 height="80" alt="Current Image" class="mb-2 rounded">
            <span th:if="*{image} == null or *{image} == ''"
                  class="text-muted">No image</span>
        </div>

        <div class="form-group mb-3">
            <label for="imageFile">Change Image:</label>
            <input class="form-control"
                   type="file"
                   name="imageFile"
                   id="imageFile"
                   accept="image/*">
            <small class="text-muted">Để trống nếu không muốn thay đổi ảnh</small>
        </div>

        <div class="form-group mb-3">
            <label for="price">Price:</label>
            <input class="form-control"
                   type="number"
                   th:field="*{price}"
                   id="price"
                   placeholder="Price">
        </div>

        <div class="form-group mb-3">
            <label for="category">Category:</label>
            <select th:field="*{category}"
                    class="form-control"
                    id="category">
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Update Product</button>
        <a th:href="@{/products}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
</body>
</html>
