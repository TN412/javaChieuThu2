spring.application.name=course-registration

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/course_registration?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=112000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory
app.upload.dir=uploads/courses

# Google OAuth2 (Điền Client ID và Secret từ Google Cloud Console)
spring.security.oauth2.client.registration.google.client-id=GGID
spring.security.oauth2.client.registration.google.client-secret=GG secret
spring.security.oauth2.client.registration.google.scope=email,profile
