<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Học Phần Của Tôi</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary">
            <i class="bi bi-journal-bookmark-fill me-2"></i>Học Phần Đã Đăng Ký
        </h2>
        <a th:href="@{/home}" class="btn btn-outline-primary">
            <i class="bi bi-plus-circle me-1"></i>Đăng ký thêm
        </a>
    </div>

    <!-- Thống kê -->
    <div class="row g-3 mb-4">
        <div class="col-12 col-md-4">
            <div class="card bg-primary text-white text-center py-3">
                <h3 class="fw-bold" th:text="${#lists.size(enrollments)}">0</h3>
                <p class="mb-0"><i class="bi bi-book me-1"></i>Học phần đã đăng ký</p>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="card bg-success text-white text-center py-3">
                <h3 class="fw-bold"
                    th:text="${#aggregates.sum(enrollments.![course.credits])}">0</h3>
                <p class="mb-0"><i class="bi bi-clock me-1"></i>Tổng số tín chỉ</p>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="card bg-info text-white text-center py-3">
                <h3 class="fw-bold" th:text="${student.username}">-</h3>
                <p class="mb-0"><i class="bi bi-person me-1"></i>Tài khoản</p>
            </div>
        </div>
    </div>

    <!-- Danh sách học phần đã đăng ký -->
    <div th:if="${#lists.isEmpty(enrollments)}" class="text-center py-5">
        <i class="bi bi-journal-x display-1 text-muted"></i>
        <h4 class="text-muted mt-3">Bạn chưa đăng ký học phần nào</h4>
        <a th:href="@{/home}" class="btn btn-primary mt-2">
            <i class="bi bi-search me-1"></i>Khám phá học phần ngay
        </a>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:unless="${#lists.isEmpty(enrollments)}">
        <div class="col" th:each="enrollment : ${enrollments}">
            <div class="card h-100 shadow-sm border-0 enrolled-card">
                <!-- Hình ảnh -->
                <div class="course-img-wrapper">
                    <img th:if="${enrollment.course.image != null and !#strings.isEmpty(enrollment.course.image)}"
                         th:src="${enrollment.course.image}"
                         class="card-img-top course-img"
                         th:alt="${enrollment.course.name}">
                    <div th:unless="${enrollment.course.image != null and !#strings.isEmpty(enrollment.course.image)}"
                         class="course-img-placeholder d-flex align-items-center justify-content-center">
                        <i class="bi bi-journal-text display-4 text-white opacity-75"></i>
                    </div>
                </div>
                <!-- Enrolled badge -->
                <div class="position-absolute top-0 end-0 m-2">
                    <span class="badge bg-success">
                        <i class="bi bi-check-circle me-1"></i>Đã đăng ký
                    </span>
                </div>
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold text-primary"
                        th:text="${enrollment.course.name}">Tên học phần</h5>
                    <div class="mb-2">
                        <span class="badge bg-success me-1">
                            <i class="bi bi-clock me-1"></i>
                            <span th:text="${enrollment.course.credits} + ' tín chỉ'"></span>
                        </span>
                        <span class="badge bg-secondary"
                              th:if="${enrollment.course.category != null}"
                              th:text="${enrollment.course.category.name}"></span>
                    </div>
                    <p class="text-muted mb-1">
                        <i class="bi bi-person-badge me-1"></i>
                        <strong>Giảng viên:</strong>
                        <span th:text="${enrollment.course.lecturer}"></span>
                    </p>
                    <p class="text-muted mb-0 mt-auto small">
                        <i class="bi bi-calendar-check me-1"></i>
                        <span>Ngày đăng ký: </span>
                        <span th:text="${#temporals.format(enrollment.enrollDate, 'dd/MM/yyyy')}"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
