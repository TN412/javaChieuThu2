<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Hệ Thống Đăng Ký Học Phần</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center min-vh-100 align-items-center py-4">
        <div class="col-12 col-sm-9 col-md-7 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-success text-white text-center py-4 rounded-top-4">
                    <a th:href="@{/home}" class="text-white text-decoration-none">
                        <i class="bi bi-person-plus-fill display-5 d-block mb-2"></i>
                    </a>
                    <h4 class="mb-0 fw-bold">Đăng Ký Tài Khoản</h4>
                    <p class="mb-0 small opacity-75">Sinh viên - Hệ Thống Đăng Ký Học Phần</p>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/register}" method="post" novalidate>
                        <!-- Username -->
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">
                                <i class="bi bi-person me-1"></i>Tên đăng nhập <span class="text-danger">*</span>
                            </label>
                            <input type="text" id="username" name="username"
                                   th:value="${username}"
                                   class="form-control form-control-lg"
                                   th:classappend="${usernameError} ? 'is-invalid'"
                                   placeholder="Nhập tên đăng nhập" required minlength="3">
                            <div class="invalid-feedback" th:if="${usernameError}" th:text="${usernameError}"></div>
                        </div>
                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">
                                <i class="bi bi-envelope me-1"></i>Email <span class="text-danger">*</span>
                            </label>
                            <input type="email" id="email" name="email"
                                   th:value="${email}"
                                   class="form-control form-control-lg"
                                   th:classappend="${emailError} ? 'is-invalid'"
                                   placeholder="Nhập địa chỉ email" required>
                            <div class="invalid-feedback" th:if="${emailError}" th:text="${emailError}"></div>
                        </div>
                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">
                                <i class="bi bi-lock me-1"></i>Mật khẩu <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <input type="password" id="password" name="password"
                                       class="form-control form-control-lg"
                                       th:classappend="${passwordError} ? 'is-invalid'"
                                       placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)" required minlength="6">
                                <button type="button" class="btn btn-outline-secondary"
                                        onclick="togglePassword('password', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-semibold">
                                <i class="bi bi-lock-fill me-1"></i>Xác nhận mật khẩu <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <input type="password" id="confirmPassword" name="confirmPassword"
                                       class="form-control form-control-lg"
                                       th:classappend="${passwordError} ? 'is-invalid'"
                                       placeholder="Nhập lại mật khẩu" required>
                                <button type="button" class="btn btn-outline-secondary"
                                        onclick="togglePassword('confirmPassword', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                                <div class="invalid-feedback" th:if="${passwordError}" th:text="${passwordError}"></div>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="bi bi-person-check me-2"></i>Tạo Tài Khoản
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3 bg-light rounded-bottom-4">
                    <p class="mb-0 text-muted">
                        Đã có tài khoản?
                        <a th:href="@{/login}" class="text-primary fw-semibold">Đăng nhập ngay</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
}
</script>
</body>
</html>
