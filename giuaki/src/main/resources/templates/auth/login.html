<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Đăng Ký Học Phần</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center min-vh-100 align-items-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                    <a th:href="@{/home}" class="text-white text-decoration-none">
                        <i class="bi bi-mortarboard-fill display-5 d-block mb-2"></i>
                    </a>
                    <h4 class="mb-0 fw-bold">Đăng Nhập</h4>
                    <p class="mb-0 small opacity-75">Hệ Thống Đăng Ký Học Phần</p>
                </div>
                <div class="card-body p-4">
                    <!-- Thông báo lỗi -->
                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>
                    <!-- Thông báo đăng xuất -->
                    <div th:if="${logoutMessage}" class="alert alert-success" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${logoutMessage}"></span>
                    </div>
                    <!-- Thông báo đăng ký thành công -->
                    <div th:if="${param.registered}" class="alert alert-success" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        Đăng ký thành công! Vui lòng đăng nhập.
                    </div>

                    <!-- Form đăng nhập -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">
                                <i class="bi bi-person me-1"></i>Tên đăng nhập
                            </label>
                            <input type="text" class="form-control form-control-lg"
                                   id="username" name="username"
                                   placeholder="Nhập tên đăng nhập" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">
                                <i class="bi bi-lock me-1"></i>Mật khẩu
                            </label>
                            <div class="input-group">
                                <input type="password" class="form-control form-control-lg"
                                       id="password" name="password"
                                       placeholder="Nhập mật khẩu" required>
                                <button type="button" class="btn btn-outline-secondary"
                                        onclick="togglePassword('password', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập
                            </button>
                        </div>
                    </form>

                    <!-- Divider Google Login (Câu 9) -->
                    <div class="divider my-3">
                        <span class="divider-text text-muted small">hoặc</span>
                    </div>
                    <div class="d-grid">
                        <a th:href="@{/oauth2/authorization/google}"
                           class="btn btn-outline-secondary btn-lg">
                            <img src="https://www.google.com/favicon.ico" width="18" height="18" class="me-2" alt="Google">
                            Đăng nhập với Google
                        </a>
                    </div>
                </div>
                <div class="card-footer text-center py-3 bg-light rounded-bottom-4">
                    <p class="mb-0 text-muted">
                        Chưa có tài khoản?
                        <a th:href="@{/register}" class="text-primary fw-semibold">Đăng ký ngay</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
}
</script>
</body>
</html>
