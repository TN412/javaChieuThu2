<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Thêm Học Phần</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white py-3">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-plus-circle me-2"></i>Thêm Học Phần Mới
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/courses/add}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <!-- Tên học phần -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">
                                <i class="bi bi-book me-1"></i>Tên học phần <span class="text-danger">*</span>
                            </label>
                            <input type="text" id="name" name="name"
                                   class="form-control" placeholder="Nhập tên học phần" required>
                        </div>

                        <!-- Số tín chỉ -->
                        <div class="mb-3">
                            <label for="credits" class="form-label fw-semibold">
                                <i class="bi bi-clock me-1"></i>Số tín chỉ <span class="text-danger">*</span>
                            </label>
                            <input type="number" id="credits" name="credits"
                                   class="form-control" min="1" max="10" placeholder="Nhập số tín chỉ" required>
                        </div>

                        <!-- Giảng viên -->
                        <div class="mb-3">
                            <label for="lecturer" class="form-label fw-semibold">
                                <i class="bi bi-person-badge me-1"></i>Giảng viên <span class="text-danger">*</span>
                            </label>
                            <input type="text" id="lecturer" name="lecturer"
                                   class="form-control" placeholder="Nhập tên giảng viên" required>
                        </div>

                        <!-- Danh mục -->
                        <div class="mb-3">
                            <label for="category" class="form-label fw-semibold">
                                <i class="bi bi-tag me-1"></i>Danh mục
                            </label>
                            <select id="category" name="category.id" class="form-select">
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}">Danh mục</option>
                            </select>
                        </div>

                        <!-- Hình ảnh -->
                        <div class="mb-4">
                            <label for="imageFile" class="form-label fw-semibold">
                                <i class="bi bi-image me-1"></i>Hình ảnh minh họa
                            </label>
                            <input type="file" id="imageFile" name="imageFile"
                                   class="form-control" accept="image/*"
                                   onchange="previewImage(this)">
                            <div id="imagePreview" class="mt-2 d-none">
                                <img id="preview" src="#" alt="Preview"
                                     class="rounded border" style="max-height:150px;">
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle me-1"></i>Thêm học phần
                            </button>
                            <a th:href="@{/admin/courses}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Quay lại
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
function previewImage(input) {
    const preview = document.getElementById('imagePreview');
    const img = document.getElementById('preview');
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
            img.src = e.target.result;
            preview.classList.remove('d-none');
        };
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
</body>
</html>
