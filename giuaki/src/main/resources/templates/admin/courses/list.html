<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Quản Lý Học Phần</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary">
            <i class="bi bi-book me-2"></i>Quản Lý Học Phần
        </h2>
        <a th:href="@{/admin/courses/add}" class="btn btn-success">
            <i class="bi bi-plus-circle me-1"></i>Thêm Học Phần
        </a>
    </div>

    <!-- Search -->
    <form th:action="@{/admin/courses}" method="get" class="mb-3">
        <div class="input-group" style="max-width: 400px;">
            <input type="text" class="form-control" name="keyword"
                   th:value="${keyword}" placeholder="Tìm kiếm học phần...">
            <button class="btn btn-primary" type="submit">
                <i class="bi bi-search"></i>
            </button>
            <a th:href="@{/admin/courses}" class="btn btn-outline-secondary">
                <i class="bi bi-x"></i>
            </a>
        </div>
    </form>

    <!-- Table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th>#</th>
                        <th>Hình ảnh</th>
                        <th>Tên học phần</th>
                        <th>Tín chỉ</th>
                        <th>Giảng viên</th>
                        <th>Danh mục</th>
                        <th class="text-center">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(courses)}">
                        <td colspan="7" class="text-center py-4 text-muted">
                            <i class="bi bi-journal-x me-2"></i>Chưa có học phần nào
                        </td>
                    </tr>
                    <tr th:each="course, stat : ${courses}">
                        <td th:text="${currentPage * 10 + stat.index + 1}">1</td>
                        <td>
                            <img th:if="${course.image != null and !#strings.isEmpty(course.image)}"
                                 th:src="${course.image}" alt="Course image"
                                 class="rounded" style="width:60px;height:45px;object-fit:cover;">
                            <span th:unless="${course.image != null and !#strings.isEmpty(course.image)}"
                                  class="badge bg-secondary">
                                <i class="bi bi-image"></i>
                            </span>
                        </td>
                        <td class="fw-semibold" th:text="${course.name}">Tên học phần</td>
                        <td>
                            <span class="badge bg-success" th:text="${course.credits} + ' tín chỉ'"></span>
                        </td>
                        <td th:text="${course.lecturer}">Giảng viên</td>
                        <td>
                            <span th:if="${course.category != null}"
                                  class="badge bg-secondary" th:text="${course.category.name}"></span>
                            <span th:unless="${course.category != null}" class="text-muted">-</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{'/admin/courses/edit/' + ${course.id}}"
                               class="btn btn-warning btn-sm me-1">
                                <i class="bi bi-pencil"></i> Sửa
                            </a>
                            <form th:action="@{'/admin/courses/delete/' + ${course.id}}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Bạn có chắc muốn xóa học phần này?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="bi bi-trash"></i> Xóa
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/courses(page=${currentPage - 1}, keyword=${keyword})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/admin/courses(page=${i}, keyword=${keyword})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/courses(page=${currentPage + 1}, keyword=${keyword})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
