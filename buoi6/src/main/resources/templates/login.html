<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Đăng nhập - Shop App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f0f2f5; }
        .login-box h2 { text-align: center; margin-bottom: 20px; font-size: 20px; }
        .login-box .form-group label { font-size: 13px; font-weight: 600; }
        .btn-login { width: 100%; padding: 9px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; margin-top: 4px; }
        .btn-login:hover { background: #1d4ed8; }
        .alert-logout { background: #dcfce7; color: #166534; padding: 10px 14px; border-radius: 4px; margin-bottom: 14px; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Đăng nhập</h2>

    <div th:if="${param.error}" class="alert-error">
        Sai tên đăng nhập hoặc mật khẩu!
    </div>
    <div th:if="${param.logout}" class="alert-logout">
        Đã đăng xuất thành công!
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Nhập username..." required/>
        </div>
        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Nhập mật khẩu..." required/>
        </div>
        <button type="submit" class="btn-login">Đăng nhập</button>
    </form>
</div>
</body>
</html>
